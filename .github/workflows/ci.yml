name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: version
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.value }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[server,dev]'
      - name: Security checks
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install 'bandit>=1.7' 'pip-audit>=2.7' 'ruff>=0.6'
          bandit -r src -q -ll
          ruff check --select S src
          python -m pip freeze | grep -vi '^opennomos-pm-gateway' > "$RUNNER_TEMP/requirements.txt"
          pip-audit -r "$RUNNER_TEMP/requirements.txt"
      - name: Run tests
        run: python -m pytest

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          TARBALL="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$TARBALL" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $TARBALL" | sha256sum -c -
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Determine scan range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=""
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            base="${PR_BASE_SHA}"
          elif [[ "${EVENT_NAME}" == "push" ]]; then
            base="${BEFORE_SHA}"
          fi
          # A new branch, or a force-push whose old tip is unknown here, has no
          # usable base: scan every reachable commit instead of skipping the gate.
          if [[ -z "${base}" ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            echo "log-opts=--all" >> "$GITHUB_OUTPUT"
          else
            echo "log-opts=${base}..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Scan commits for secrets
        env:
          LOG_OPTS: ${{ steps.range.outputs.log-opts }}
        run: gitleaks git --config .gitleaks.toml --redact --no-banner -v --log-opts="$LOG_OPTS"

  monday-live:
    name: monday.com live compatibility
    needs: version
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[server,dev]'
      - name: Detect monday.com credentials
        id: monday
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
        run: |
          if [[ -n "${MONDAY_API_TOKEN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "monday.com live checks skipped: the MONDAY_API_TOKEN secret is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run live monday.com checks
        if: steps.monday.outputs.available == 'true'
        env:
          MONDAY_LIVE: "1"
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_LIVE_WRITE_BOARD_ID: ${{ vars.MONDAY_LIVE_WRITE_BOARD_ID }}
        run: |
          python -m pytest tests/live -m live -v \
            --junitxml=reports/monday-live/junit.xml
      - name: Upload monday.com report
        if: always() && steps.monday.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: monday-live-report
          path: reports/monday-live/
          if-no-files-found: warn

  asana-live:
    name: Asana live compatibility
    needs: version
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[server,dev]'
      - name: Detect Asana credentials
        id: asana
        env:
          ASANA_API_TOKEN: ${{ secrets.ASANA_API_TOKEN }}
        run: |
          if [[ -n "${ASANA_API_TOKEN}" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Asana live checks skipped: the ASANA_API_TOKEN secret is not configured." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Run live Asana checks
        if: steps.asana.outputs.available == 'true'
        env:
          ASANA_LIVE: "1"
          ASANA_API_TOKEN: ${{ secrets.ASANA_API_TOKEN }}
          ASANA_LIVE_WRITE_PROJECT_ID: ${{ vars.ASANA_LIVE_WRITE_PROJECT_ID }}
        run: |
          python -m pytest tests/live/test_asana_live.py -m live -v \
            --junitxml=reports/asana-live/junit.xml
      - name: Upload Asana report
        if: always() && steps.asana.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: asana-live-report
          path: reports/asana-live/
          if-no-files-found: warn

  generated-contract:
    name: Generated contract is current
    needs: version
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install OpenAPI Generator 7.24.0
        run: |
          JAR="$RUNNER_TEMP/openapi-generator-cli.jar"
          curl -fsSL -o "$JAR" \
            https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/7.24.0/openapi-generator-cli-7.24.0.jar
          echo "4b83ccc6fd43056c8c631cd0195e5100bd0550912502527bab09ac76152dab0c  $JAR" | sha256sum -c -
          printf '#!/usr/bin/env sh\nexec java -jar "%s" "$@"\n' "$JAR" > "$RUNNER_TEMP/openapi-generator-cli"
          chmod +x "$RUNNER_TEMP/openapi-generator-cli"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check generated code
        env:
          OPENAPI_GENERATOR_VERSION: "7.24.0"
        run: ./scripts/generate-server.sh --check

  version:
    name: Determine package version
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install setuptools-scm
        run: python -m pip install 'setuptools-scm>=8.0'
      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            if ! git tag -l 'v*' | grep -q .; then
              # Temporary bootstrap tag; this is local to the runner and is not
              # pushed. It keeps development versions ordered after 0.1.0a1.
              git tag v0.1.0a1 "$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            fi
            if ! version="$(python -m setuptools_scm)"; then
              version="0.1.0a2.dev${GITHUB_RUN_ID}"
            fi
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "Using package version ${version}"

  container:
    name: Container security
    needs: [test, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build image
        run: docker build --pull --build-arg PM_GATEWAY_VERSION="${{ needs.version.outputs.value }}" -t opennomos-pm-gateway:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: opennomos-pm-gateway:ci
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  build:
    name: Build distribution
    needs: [test, generated-contract, version]
    env:
      SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install 'build>=1.2' 'twine>=5'
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

